# UndoLog local development stack.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# Services:
#   postgres   - Primary database (shared by all services)
#   engine     - Rust gRPC effect engine (undolog-engine)
#   proxy      - Go MCP interceptor (undolog-proxy)
#   dashboard  - Next.js dashboard (apps/dashboard)
#
# All images are built from the local Dockerfiles in infra/.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: undolog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  engine:
    build:
      context: .
      dockerfile: infra/Dockerfile.engine
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/undolog
      UNDOLOG_LOG_LEVEL: debug
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: infra/Dockerfile.proxy
    environment:
      UNDOLOG_PROXY_LISTEN_ADDR: :8080
      UNDOLOG_PROXY_ENGINE_GRPC_ADDR: engine:50051
      UNDOLOG_PROXY_UPSTREAM_TOOL_URL: http://tool-server:9091/tools
      UNDOLOG_PROXY_API_KEYS: dev-key=00000000-0000-0000-0000-000000000001,dev-key-2=00000000-0000-0000-0000-000000000002
      UNDOLOG_LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      engine:
        condition: service_started

  tool-server:
    build:
      context: infra/mock-tool-server
      dockerfile: Dockerfile
    ports:
      - "9091:9091"
    depends_on: {}

  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    environment:
      NEXT_PUBLIC_PROXY_URL: http://localhost:8080
      NEXT_PUBLIC_SSE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      proxy:
        condition: service_started

volumes:
  pgdata:
