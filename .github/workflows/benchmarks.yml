name: Benchmarks

# Runs when a release tag is pushed: it compiles the engine with the toolchain
# pinned in rust-toolchain.toml and validates the regression comparison tool
# against the stored baseline.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: undolog_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build engine
        run: cargo build --release -p undolog-engine --features pg

      - name: Compare baseline against itself (validate tooling)
        run: |
          python3 benchmarks/compare_baseline.py \
            --results benchmarks/results/c5.xlarge.json \
            --baseline benchmarks/results/c5.xlarge.json \
            --threshold 10
