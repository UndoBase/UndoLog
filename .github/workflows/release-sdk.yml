# Publish @undolog/sdk to npm when a release tag is pushed.
# Tag format:  @undolog/sdk@v<major>.<minor>.<patch>

name: Release TypeScript SDK

on:
  push:
    tags:
      - "@undolog/sdk@v*.*.*"

env:
  NODE_VERSION: "24"

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/undolog-ts
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Publish to npm with provenance
        run: npm publish --provenance
