name: PR Benchmark Quick Check

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always
  UNDOLOG_PROXY_URL: http://localhost:8080
  MOCK_TOOL_SERVER_URL: http://localhost:9091
  UNDOLOG_API_KEY: dev-key
  UNDOLOG_API_KEY_2: dev-key-2

jobs:
  quick-check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e "sdks/undolog-py[dev]"

      - name: Start stack
        uses: ./.github/actions/start-stack

      - name: Run quick benchmark (overhead only, 100 samples)
        run: |
          python -m infra.benchmarks.run \
            --benchmark overhead \
            --quick \
            --no-resources 2>&1 | tee bench-output.txt

      - name: Verify benchmark completed successfully
        run: |
          if grep -q "overhead-direct" bench-output.txt && \
             grep -q "overhead-safe" bench-output.txt && \
             grep -q "overhead-compensable" bench-output.txt; then
            echo "Benchmark quick check PASSED"
          else
            echo "Benchmark quick check FAILED - missing expected results"
            exit 1
          fi
          # Verify plausible latencies (< 10s for any cell).
          while IFS= read -r line; do
            if [[ "$line" =~ p99=([0-9]+) ]]; then
              p99="${BASH_REMATCH[1]}"
              if (( p99 > 10_000_000 )); then
                echo "Suspiciously high p99 latency: $p99 us"
              fi
            fi
          done < bench-output.txt

      - name: Archive quick check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-quick-results
          path: bench-results/
          retention-days: 30

      - name: Stop stack
        if: always()
        run: docker compose down
