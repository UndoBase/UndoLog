name: E2E

# Post-merge only: the integration suites run against the full stack on
# main, and a change that cannot reach the stack skips them.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "proto/**"
      - "services/**"
      - "sdks/**"
      - "infra/**"
      - "examples/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
      - ".github/actions/**"

env:
  CARGO_TERM_COLOR: always
  UNDOLOG_PROXY_URL: http://localhost:8080
  MOCK_TOOL_SERVER_URL: http://localhost:9091
  UNDOLOG_API_KEY: dev-key
  UNDOLOG_API_KEY_2: dev-key-2

jobs:
  integration:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sdks/undolog-py/pyproject.toml
            examples/**/pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install asyncpg
          pip install -e "sdks/undolog-py[dev]"
          pip install -e examples/example_tools
          pip install -e examples/langchain-support-agent
          pip install -e examples/langchain-support-agent[dev]

      - name: Start stack
        uses: ./.github/actions/start-stack

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/undolog-ts/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm ci
        working-directory: sdks/undolog-ts

      - name: Build TypeScript SDK
        run: npm run build
        working-directory: sdks/undolog-ts

      - name: Run Python integration tests
        run: python -m pytest examples/langchain-support-agent/tests/test_live_stack.py -v

      - name: Run SSE dashboard integration tests
        run: python -m pytest examples/langchain-support-agent/tests/test_sse_dashboard.py -v

      - name: Run TypeScript integration tests
        run: npm run test:integration
        working-directory: sdks/undolog-ts

      - name: Stop stack
        if: always()
        run: docker compose down
