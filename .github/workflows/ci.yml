name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/undolog-proxy/go.mod

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e "sdks/undolog-py[dev]"
          pip install -e examples/example_tools
          for dir in examples/*-support-agent; do
            pip install -e "$dir"
            pip install -e "$dir[dev]" || true
          done

      - name: Install Node dependencies
        run: npm ci
        working-directory: apps/www

      - name: Run make check
        run: make check

      - name: Run example tests (unit only)
        run: |
          for dir in examples/*-support-agent; do
            echo "=== Testing $dir ==="
            (cd "$dir" && python -m pytest -v --no-header -m "not integration")
          done

      - name: Run mock-tool-server tests
        run: python -m pytest infra/mock-tool-server/tests/ -v --no-header

      - name: CHANGELOG validation
        if: github.event_name == 'pull_request'
        run: |
          if ! grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing the [Unreleased] section."
            exit 1
          fi
          title="${{ github.event.pull_request.title }}"
          case "$title" in
            chore*|docs*) exit 0 ;;
          esac
          lines=$(sed -n '/^## \[Unreleased\]/,/^## /p' CHANGELOG.md | grep -c '^- ')
          if [ "$lines" -eq 0 ]; then
            echo "ERROR: [Unreleased] section is empty."
            exit 1
          fi

      - name: Commit message format
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow 2>/dev/null || true
          npm install --save-dev @commitlint/cli @commitlint/config-conventional
          echo "${{ github.event.pull_request.title }}" | npx commitlint
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Docs - broken link check
        run: |
          npm install --save-dev markdown-link-check
          find docs -name '*.md' -exec npx markdown-link-check {} \;

      - name: Docs - rustdoc completeness
        run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps --workspace --exclude undolog-engine
