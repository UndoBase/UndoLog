[package]
name              = "undolog-engine"
version.workspace = true
edition.workspace = true
description       = "UndoLog Effect Engine - core safety kernel"
keywords          = ["undolog", "effect-tracking", "engine", "gRPC", "safety"]
categories        = ["development-tools", "network-programming"]
readme            = "../../README.md"
homepage          = "https://github.com/UndoBase/UndoLog"

[[bin]]
name = "undolog-engine"
path = "src/main.rs"
required-features = ["pg"]

[[bin]]
name = "undolog-engine-sqlite"
path = "src/main_sqlite.rs"
required-features = ["sqlite"]

[features]
default = ["pg"]
pg      = ["dep:undolog-store"]
sqlite  = ["undolog-store/sqlite"]

[dependencies]
undolog-types.workspace  = true
undolog-store            = { workspace = true, optional = true }
tokio.workspace        = true
serde.workspace        = true
serde_json.workspace   = true
uuid.workspace         = true
chrono.workspace       = true
blake3.workspace       = true
thiserror.workspace    = true
anyhow.workspace       = true
tracing.workspace      = true
tracing-subscriber.workspace = true
sqlx.workspace         = true
tonic.workspace        = true
prost.workspace        = true
prost-types.workspace  = true

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.6"
tokio    = { version = "1.52", features = ["full", "test-util"] }
