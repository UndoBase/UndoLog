[package]
name              = "undolog-store"
version.workspace = true
edition.workspace = true
description       = "UndoLog storage layer (PostgreSQL + SQLite)"
keywords          = ["undolog", "effect-tracking", "postgres", "sqlite", "storage"]
categories        = ["database", "development-tools"]
readme            = "../../README.md"
homepage          = "https://github.com/UndoBase/UndoLog"

[features]
default = []
sqlite  = []

[dependencies]
undolog-types.workspace  = true
tokio.workspace        = true
serde.workspace        = true
serde_json.workspace   = true
sqlx.workspace         = true
uuid.workspace         = true
chrono.workspace       = true
thiserror.workspace    = true
tracing.workspace      = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
