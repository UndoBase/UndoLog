apiVersion: v1
kind: Service
metadata:
  name: {{ include "undolog.fullname" . }}-proxy
  labels:
    {{- include "undolog.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.proxy.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "undolog.proxy.selectorLabels" . | nindent 4 }}
