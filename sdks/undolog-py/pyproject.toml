[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undolog-sdk"
version = "0.1.0"
description = "Python SDK for the UndoLog effect-tracking and exactly-once execution system"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "UndoLog Contributors"},
]
keywords = ["undolog", "exactly-once", "effect-tracking", "llm", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
    "blake3>=0.4.0",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/UndoBase/UndoLog"
Source = "https://github.com/UndoBase/UndoLog"
Tracker = "https://github.com/UndoBase/UndoLog/issues"

[tool.setuptools.packages.find]
include = ["undolog_sdk*"]

[tool.setuptools.package-data]
undolog_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10",
    "ruff>=0.4.0",
]
