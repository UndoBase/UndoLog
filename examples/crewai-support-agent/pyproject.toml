[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "undolog-example-crewai"
version = "0.1.0"
description = "CrewAI agent integrated with UndoLog for exactly-once tool execution"
requires-python = ">=3.11"
dependencies = [
    "undolog-sdk>=0.1.0",
    "crewai>=0.100",
    "langchain-openai>=0.3",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
