[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "undolog-example-langchain"
version = "0.1.0"
description = "LangChain agent integrated with UndoLog for exactly-once tool execution"
requires-python = ">=3.11"
dependencies = [
    "undolog-sdk>=0.1.0",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "asyncpg>=0.29",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live UndoLog stack (docker compose up -d)",
]
