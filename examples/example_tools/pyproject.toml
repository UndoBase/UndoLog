[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "example-tools"
version = "0.1.0"
description = "Shared tool definitions for UndoLog framework examples"
requires-python = ">=3.10"
dependencies = [
    "undolog-sdk>=0.1.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["example_tools*"]
